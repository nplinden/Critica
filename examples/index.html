<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Critica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap">
<script>
  // Theme preference (Settings → Appearance): "dark" (default), "light" or "system".
  try {
    document.documentElement.dataset.theme = localStorage.getItem("critica.theme") || "dark";
  } catch {
    document.documentElement.dataset.theme = "dark";
  }
</script>
<style>
  :root {
    --font-ui: "Ubuntu", system-ui, -apple-system, sans-serif;
    --bg: #14161a; --panel: #1b1e24; --panel-2: #20242b; --line: #2c313a; --line-2: #3a404b;
    --text: #d8dce3; --muted: #8a919e; --accent: #6cb6ff; --accent-bg: #1f3550; --hl: #ffd166; --err: #ff7b72;
    --overlay: var(--overlay); --cut: #ff9b85; --cut-border: #6a3a33; --shared-border: #2b4a6e;
    --warn-border: #6b5a2a; --err-border: #6a3a33; --on-accent: #0b1220;
    color-scheme: dark;
  }
  /* Light theme: chosen in Settings, or following the OS when set to System. */
  :root[data-theme="light"] {
    --bg: #f3f4f6; --panel: #ffffff; --panel-2: #eef0f3; --line: #dfe3e8; --line-2: #c8ced6;
    --text: #1f2328; --muted: #5d6876; --accent: #0969da; --accent-bg: #dcebff; --hl: #9a6700; --err: #cf222e;
    --overlay: rgba(255, 255, 255, 0.94); --cut: #b3372b; --cut-border: #f0c4bd; --shared-border: #b6d4f5;
    --warn-border: #e8d38f; --err-border: #f0c4bd; --on-accent: #ffffff;
    color-scheme: light;
  }
  @media (prefers-color-scheme: light) {
    :root[data-theme="system"] {
      --bg: #f3f4f6; --panel: #ffffff; --panel-2: #eef0f3; --line: #dfe3e8; --line-2: #c8ced6;
      --text: #1f2328; --muted: #5d6876; --accent: #0969da; --accent-bg: #dcebff; --hl: #9a6700; --err: #cf222e;
      --overlay: rgba(255, 255, 255, 0.94); --cut: #b3372b; --cut-border: #f0c4bd; --shared-border: #b6d4f5;
      --warn-border: #e8d38f; --err-border: #f0c4bd; --on-accent: #ffffff;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 var(--font-ui); }
  body { display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
  body > header { grid-row: 1; } body > .ribbon { grid-row: 2; } body > main { grid-row: 3; }
  button, select, input { font: inherit; color: inherit; }
  svg.icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.3; stroke-linejoin: round; }

  /* ---- toolbar ---- */
  .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding: 6px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .toolbar h1 { font-size: 14px; font-weight: 500; margin: 0 8px 0 2px; }
  .group { display: flex; gap: 2px; padding-right: 8px; margin-right: 2px; border-right: 1px solid var(--line); }
  .group:last-of-type { border-right: 0; }
  .spacer { flex: 1; }
  .tb { display: inline-flex; align-items: center; gap: 5px; background: transparent; border: 1px solid transparent; border-radius: 5px; padding: 4px 8px; cursor: pointer; white-space: nowrap; }
  .tb:hover:not(:disabled) { background: var(--panel-2); border-color: var(--line-2); }
  .tb:disabled { opacity: 0.35; cursor: default; }
  .tb.on { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); }
  .toolbar a { color: var(--accent); text-decoration: none; padding: 0 4px; }

  /* ---- layout ---- */
  main { display: grid; grid-template-columns: 270px 1fr 280px; min-height: 0; }
  .panel { background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .panel > h2 { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0; padding: 10px 12px 6px; display: flex; align-items: center; justify-content: space-between; }
  #outline { border-right: 1px solid var(--line); }
  #props { border-left: 1px solid var(--line); overflow-y: auto; }

  /* ---- tree ---- */
  #tree { flex: 1; overflow: auto; padding: 2px 0 24px; outline: none; }
  #tree.drop-root { box-shadow: inset 0 0 0 2px var(--accent); }
  .row { position: relative; display: flex; align-items: center; gap: 5px; height: 26px; padding: 0 6px 0 calc(var(--depth) * 16px + 6px); cursor: default; user-select: none; border: 1px solid transparent; }
  .row::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--depth) * 16px); background: repeating-linear-gradient(to right, transparent 0 13px, var(--line-2) 13px 14px, transparent 14px 16px); }
  .row:hover { background: var(--panel-2); }
  .row.selected { background: var(--accent-bg); }
  .row.primary { border-color: var(--accent); }
  .row.disabled .name, .row.disabled svg { opacity: 0.4; }
  .row.disabled .name { text-decoration: line-through; }
  .row.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .row.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
  .row.drop-inside { background: var(--accent-bg); border-color: var(--accent); border-style: dashed; }
  .caret { width: 14px; text-align: center; color: var(--muted); font-size: 10px; cursor: pointer; flex: none; }
  .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .role { font-size: 10px; padding: 0 5px; border-radius: 8px; border: 1px solid var(--line-2); color: var(--muted); }
  .role.cut { color: var(--cut); border-color: var(--cut-border); }
  .order { font-size: 10px; min-width: 16px; height: 16px; line-height: 16px; text-align: center; border-radius: 8px; background: var(--accent); color: var(--on-accent); font-weight: 700; }
  .eye { background: none; border: 0; color: var(--muted); cursor: pointer; padding: 2px; width: 22px; font-size: 12px; }
  .eye:hover { color: var(--text); }
  .placeholder { height: 24px; display: flex; align-items: center; padding-left: calc(var(--depth) * 16px + 26px); color: var(--muted); font-style: italic; font-size: 12px; position: relative; }
  .placeholder::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: calc(var(--depth) * 16px); background: repeating-linear-gradient(to right, transparent 0 13px, var(--line-2) 13px 14px, transparent 14px 16px); }
  .placeholder.drop-inside { color: var(--accent); }
  .section-header.toggle { cursor: pointer; user-select: none; }
  .section-header { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 14px 12px 4px; border-top: 1px solid var(--line); margin-top: 8px; }
  .badge { font-size: 10px; padding: 0 5px; border-radius: 8px; background: var(--panel-2); border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap; max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
  .surface-row { height: 22px; font-size: 12px; color: var(--muted); }
  .surface-row svg.icon { width: 14px; height: 14px; }
  .surface-row .sense { width: 10px; text-align: center; color: var(--text); font-weight: 500; flex: none; }
  .surface-row .surface-type { color: var(--text); }
  .surface-row .surface-name { color: var(--text); font-weight: 500; }
  .surface-row .surface-name + .surface-type { color: var(--muted); }
  .surface-row input.rename { flex: 1; min-width: 0; height: 18px; padding: 0 4px; font-size: 12px; }
  .surface-row .surface-coeffs { font-variant-numeric: tabular-nums; }
  .badge.shared { color: var(--accent); border-color: var(--shared-border); }
  .ref-name { font-style: italic; }
  .badge.warn { color: var(--hl); border-color: var(--warn-border); }
  .badge.err { color: var(--err); border-color: var(--err-border); }
  .oid { font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row.error .name { color: var(--err); }
  .note { color: var(--muted); font-size: 11.5px; line-height: 1.45; margin: 2px 0 6px; }
  kbd { font: 500 11px var(--font-ui); background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 3px; padding: 0 4px; }

  /* ---- viewport ---- */
  #view { position: relative; min-width: 0; min-height: 0; }
  #canvas { width: 100%; height: 100%; display: block; touch-action: none; }
  /* ---- menu bar ---- */
  .menubar { display: flex; gap: 2px; }
  .menu { position: relative; }
  .menu-button[aria-expanded="true"] { background: var(--panel-2); border-color: var(--line-2); }
  .menu-list { position: absolute; top: calc(100% + 4px); left: 0; z-index: 20; min-width: 190px; display: flex; flex-direction: column; padding: 4px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 6px; box-shadow: 0 8px 28px rgba(0, 0, 0, 0.45); }
  .menu-list[hidden] { display: none; }
  .menu-item { display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; padding: 5px 10px; border: 0; border-radius: 4px; background: none; text-align: left; cursor: pointer; white-space: nowrap; }
  .menu-item:hover, .menu-item:focus-visible, .menu-item[aria-expanded="true"] { background: var(--accent-bg); outline: none; }
  .menu-item kbd { background: none; border: 0; color: var(--muted); padding: 0; }
  .context-menu { position: fixed; top: 0; left: 0; z-index: 50; }
  .menu-item[disabled] { opacity: 0.45; cursor: default; background: none; }
  .menu-sep { height: 1px; margin: 4px 6px; background: var(--line); }
  .submenu { position: relative; }
  .submenu-list { top: -5px; left: calc(100% + 2px); }
  .chevron { color: var(--muted); font-size: 10px; }

  /* ---- ribbon: one tab per workspace, its tools grouped below ---- */
  .toolbar { padding-bottom: 0; border-bottom: 0; align-items: flex-end; }
  .toolbar h1, .toolbar .menubar { align-self: center; margin-bottom: 4px; }
  .tabs { display: flex; gap: 2px; margin-left: 18px; align-self: flex-end; }
  .tab { background: none; border: 1px solid transparent; border-bottom: 0; border-radius: 6px 6px 0 0; padding: 5px 16px 6px; cursor: pointer; color: var(--muted); position: relative; top: 1px; }
  .tab:hover { color: var(--text); }
  .tab.on { background: var(--bg); color: var(--text); border-color: var(--line); font-weight: 500; }
  .tab.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: 0; height: 2px; border-radius: 1px; background: var(--accent); }
  .ribbon-toggle { align-self: center; margin-bottom: 4px; color: var(--muted); }
  main[hidden] { display: none; }
  .ribbon { display: flex; background: var(--bg); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); overflow-x: auto; overflow-y: visible; }
  .ribbon.collapsed { display: none; }
  .ribbon-panel { display: flex; align-items: stretch; padding: 4px 6px 0; height: 96px; } /* same for every tab: switching does not shift the workspace */
  .ribbon-panel[hidden] { display: none; }
  .rgroup { display: flex; flex-direction: column; padding: 0 6px; border-right: 1px solid var(--line); }
  .rgroup:last-child { border-right: 0; }
  .rgroup-body { flex: 1; display: flex; align-items: flex-start; gap: 2px; }
  .rgroup-label { text-align: center; font-size: 10.5px; color: var(--muted); padding: 2px 0 4px; white-space: nowrap; }
  /* Large buttons: icon above label. */
  .rgroup-body.big .tb, .tb.big { flex-direction: column; justify-content: flex-start; gap: 3px; min-width: 54px; padding: 5px 6px 4px; font-size: 12px; }
  .rgroup-body.big .tb svg.icon, .tb.big svg.icon { width: 22px; height: 22px; stroke-width: 1.1; }
  /* Small buttons: stacked in columns of three. */
  .rstack { display: grid; grid-auto-flow: column; grid-template-rows: repeat(3, auto); gap: 1px 2px; align-content: start; }
  .rstack .tb { padding: 2px 8px 2px 5px; font-size: 12px; justify-content: flex-start; }
  .rstack .tb svg.icon { width: 14px; height: 14px; }
  .rdrop { position: relative; }
  .ribbon-menu { position: fixed; z-index: 30; display: flex; flex-direction: column; gap: 1px; padding: 6px; min-width: 210px; background: var(--panel); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); }
  .ribbon-menu[hidden] { display: none; }
  .ribbon-menu .tb { justify-content: flex-start; }
  .ribbon-menu-title + .tb, .ribbon-menu .tb + .ribbon-menu-title { margin-top: 0; }
  .ribbon-menu .tb + .ribbon-menu-title { margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line); }
  .ribbon-menu-title { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 2px 8px 6px; }

  /* ---- source workspace (the geometry viewport moves into #src-view-slot) ---- */
  .sources-main { grid-template-columns: 250px 1fr 340px; }
  #src-list-panel { border-right: 1px solid var(--line); }
  #src-list { flex: 1; overflow-y: auto; padding-bottom: 8px; }
  #src-list .mat-row svg.icon { width: 15px; height: 15px; }
  #src-view-slot { position: relative; min-width: 0; min-height: 0; display: grid; }
  #src-view-slot > #view { min-height: 0; }
  #src-side { border-left: 1px solid var(--line); overflow-y: auto; }
  #src-editor { display: flex; flex-direction: column; }
  #src-editor .dist { display: contents; }
  #src-summary { border-bottom: 0; }
  #src-summary .xml-preview { max-height: 320px; }
  #src-summary summary { cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; margin: 8px 0 6px; }
  .preset-row { flex-wrap: wrap; }
  .preset-row .tb { font-size: 11.5px; padding: 2px 7px; }

  /* ---- materials workspace ---- */
  .materials-main { display: grid; grid-template-columns: 280px minmax(420px, 1fr) 360px; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; }
  .mat-status { grid-column: 1 / -1; min-height: 24px; padding: 4px 12px; border-top: 1px solid var(--line); background: var(--panel); color: var(--muted); font-size: 12px; }
  .mat-status.error { color: var(--err); }
  #mat-list-panel { border-right: 1px solid var(--line); }
  #mat-editor { overflow-y: auto; }
  #mat-summary { border-left: 1px solid var(--line); overflow-y: auto; }
  .mat-search-row { padding: 0 10px 6px; }
  #mat-list { flex: 1; overflow-y: auto; padding-bottom: 8px; }
  .mat-row { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; cursor: default; border: 1px solid transparent; }
  .mat-row:hover { background: var(--panel-2); }
  .mat-row.selected { background: var(--accent-bg); border-color: var(--accent); }
  .mat-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #mat-editor .section, #mat-summary .section { max-width: 760px; }
  .density-row { display: grid; grid-template-columns: 1fr 1.3fr; gap: 6px; margin: 5px 0; }
  .unit-input { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: center; }
  .comp-head, .comp-row { display: grid; grid-template-columns: 96px 1fr 1.1fr 30px 30px; gap: 6px; align-items: center; margin: 4px 0; }
  .comp-head { color: var(--muted); font-size: 11.5px; margin-bottom: 0; }
  .enrich-row { padding-left: 16px; grid-template-columns: 80px 1fr 1.1fr 0.8fr 30px; }
  .sab-row { display: grid; grid-template-columns: 1fr 90px 30px; gap: 6px; margin: 4px 0; }
  .formula-row { display: grid; grid-template-columns: 1fr 80px auto; gap: 6px; margin-top: 8px; }
  .formula-row .tb, .props-actions .tb { border-color: var(--line-2); }
  .icon-btn { justify-content: center; padding: 3px 0; border-color: var(--line-2); }
  .icon-btn.on { background: var(--accent-bg); color: var(--accent); }
  .muted { color: var(--muted); font-size: 12px; }
  details.section > summary { cursor: pointer; color: var(--muted); font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; margin: 8px 0 6px; }
  .comp-table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .comp-table th { text-align: right; color: var(--muted); font-weight: 400; padding: 2px 4px; }
  .comp-table td { text-align: right; padding: 2px 4px; border-top: 1px solid var(--line); }
  .comp-table th:first-child, .comp-table td:first-child { text-align: left; }
  .msg-err { color: var(--err); margin: 3px 0; }
  .msg-warn { color: var(--hl); margin: 3px 0; }
  .users { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .xml-preview { margin: 0; padding: 8px; background: var(--bg); border: 1px solid var(--line); border-radius: 5px; overflow: auto; max-height: 260px; font-size: 11.5px; line-height: 1.45; white-space: pre; }
  .library-search-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; margin-bottom: 8px; }
  #library-list { max-height: 55vh; overflow-y: auto; border: 1px solid var(--line); border-radius: 6px; }
  .lib-row { display: flex; justify-content: space-between; gap: 12px; width: 100%; padding: 6px 10px; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; cursor: pointer; }
  .lib-row:hover { background: var(--accent-bg); }
  @media (max-width: 1100px) { .materials-main { grid-template-columns: 240px 1fr; } #mat-summary { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); } }

  /* ---- dialogs ---- */
  dialog.modal { width: min(420px, calc(100vw - 32px)); max-height: calc(100vh - 64px); padding: 0; border: 1px solid var(--line-2); border-radius: 10px; background: var(--panel); color: var(--text); box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5); }
  dialog.modal[open] { display: flex; flex-direction: column; }
  dialog.modal::backdrop { background: rgba(0, 0, 0, 0.45); }
  dialog#tutorial, dialog#shortcuts { width: min(560px, calc(100vw - 32px)); }
  dialog#xml-preview { width: min(900px, calc(100vw - 32px)); height: calc(100vh - 64px); }
  #xml-preview-body { display: flex; flex-direction: column; gap: 8px; min-height: 0; flex: 1; padding-top: 10px; }
  .xml-preview-bar { display: flex; align-items: center; gap: 8px; }
  .xml-preview-bar .segmented { flex: none; }
  .xml-preview-bar .spacer { flex: 1; }
  .xml-preview-bar .tb { border-color: var(--line-2); }
  #xml-preview-body .xml-preview { flex: 1; max-height: none; min-height: 0; }
  .xml-preview-warnings { margin: 0; padding: 6px 8px 6px 24px; border: 1px solid var(--warn-border); border-radius: 5px; color: var(--hl); font-size: 12px; }
  .dialog-body { overflow-y: auto; padding: 4px 16px 16px; line-height: 1.55; }
  .dialog-body h3 { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
  .dialog-body p, .dialog-body ol, .dialog-body ul { margin: 4px 0 8px; }
  .dialog-body ol, .dialog-body ul { padding-left: 20px; }
  .dialog-body li { margin: 3px 0; }
  .dialog-body b { color: var(--text); font-weight: 500; }
  .shortcut-table { width: 100%; border-collapse: collapse; }
  .shortcut-table td { padding: 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  .shortcut-table td:first-child { width: 42%; white-space: nowrap; padding-right: 12px; }
  .shortcut-table kbd + kbd { margin-left: 4px; }
  .link-button { background: none; border: 0; padding: 0; color: var(--accent); cursor: pointer; font: inherit; }
  .dialog-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 6px; border-bottom: 1px solid var(--line); }
  .dialog-head h2 { font-size: 14px; font-weight: 500; margin: 0; }
  #settings-body .section { border-bottom: 0; padding-bottom: 14px; }

  /* ---- viewport overlays ---- */
  .panel-actions { display: flex; gap: 2px; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .panel-actions .tb { padding: 2px 6px; font-size: 12px; color: var(--text); }
  /* Three creation buttons do not fit beside the title: give them their own row. */
  #tree-head { flex-wrap: wrap; row-gap: 4px; }
  #tree-head .panel-actions { flex: 1 0 100%; margin-left: -6px; }
  .cutaway-panel { position: absolute; top: 10px; right: 10px; z-index: 3; width: 290px; padding: 8px 10px 10px; background: var(--overlay); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); }
  .cutaway-panel[hidden] { display: none; }
  .cut-title { font-size: 10.5px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .segmented { display: flex; gap: 0; border: 1px solid var(--line-2); border-radius: 5px; overflow: hidden; }
  .segmented .seg { flex: 1; justify-content: center; border: 0; border-radius: 0; padding: 3px 8px; }
  .segmented .seg + .seg { border-left: 1px solid var(--line-2); }
  .segmented .seg.on { background: var(--accent-bg); color: var(--accent); border-color: var(--line-2); }
  .cut-row { display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 8px; margin-top: 8px; }
  .cut-row > label { color: var(--muted); font-size: 12px; }
  .cut-row .segmented { grid-column: 2 / 4; }
  .cut-row input[type=range] { width: 100%; accent-color: var(--accent); }
  .cut-value { font-size: 11.5px; font-variant-numeric: tabular-nums; color: var(--muted); min-width: 44px; text-align: right; }
  .cut-actions { grid-template-columns: 1fr auto; }
  .cut-actions .check { display: flex; align-items: center; gap: 4px; color: var(--text); font-size: 12px; }
  .cut-actions .tb { border-color: var(--line-2); }
  .legend { position: absolute; left: 10px; bottom: 30px; max-height: 40%; overflow-y: auto; padding: 6px 10px; background: var(--overlay); border: 1px solid var(--line); border-radius: 6px; font-size: 12px; pointer-events: auto; }
  .legend[hidden] { display: none; }
  .legend-title { font-size: 10.5px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin-bottom: 4px; }
  .legend-row { display: flex; align-items: center; gap: 7px; line-height: 1.7; white-space: nowrap; }
  .legend-row.muted { color: var(--muted); }
  .swatch { width: 11px; height: 11px; border-radius: 2px; flex: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.3); }
  #status { position: absolute; left: 10px; bottom: 8px; right: 10px; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; pointer-events: none; display: flex; justify-content: space-between; gap: 12px; }
  #status.error #msg { color: var(--err); }
  #msg { white-space: pre-wrap; }
  #stats { white-space: nowrap; }

  /* ---- properties ---- */
  .section { padding: 4px 12px 12px; border-bottom: 1px solid var(--line); }
  .section h3 { font-size: 11px; font-weight: 500; color: var(--muted); margin: 8px 0 6px; text-transform: uppercase; letter-spacing: 0.06em; }
  .field { display: grid; grid-template-columns: 76px 1fr; align-items: center; gap: 6px; margin: 5px 0; }
  .field > label { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; }
  .vec { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .vec.vec2 { grid-template-columns: repeat(2, 1fr); }
  .field-wide { grid-template-columns: 1fr; }
  .color-field { display: flex; align-items: center; gap: 8px; }
  .color-field input[type=color] { width: 38px; height: 24px; padding: 0 2px; border: 1px solid var(--line-2); border-radius: 4px; background: var(--bg); cursor: pointer; }
  .color-field .tb { margin-left: auto; padding: 2px 8px; border-color: var(--line-2); }
  #props textarea { width: 100%; resize: vertical; background: var(--bg); color: var(--text); border: 1px solid var(--line-2); border-radius: 4px; padding: 4px 6px; font: 12.5px/1.5 var(--font-ui); font-variant-numeric: tabular-nums; }
  #props textarea:focus { outline: none; border-color: var(--accent); }
  .vec input:nth-child(1) { border-bottom-color: #a14848; }
  .vec input:nth-child(2) { border-bottom-color: #4b8a4b; }
  .vec input:nth-child(3) { border-bottom-color: #4560a8; }
  input[type=number], input[type=text], select { width: 100%; min-width: 0; background: var(--bg); border: 1px solid var(--line-2); border-radius: 4px; padding: 3px 6px; }
  input:focus, select:focus { outline: none; border-color: var(--accent); }
  .props-actions { display: flex; gap: 6px; margin-top: 8px; }
  .multi-note { margin: 0 12px 6px; padding: 6px 8px; border: 1px solid var(--shared-border); border-radius: 5px; background: var(--accent-bg); color: var(--text); font-size: 12px; line-height: 1.45; }
  .props-actions .tb { border-color: var(--line-2); }
  .info { display: grid; grid-template-columns: auto 1fr; column-gap: 14px; font-size: 12.5px; line-height: 1.7; font-variant-numeric: tabular-nums; }
  .info-label { color: var(--muted); }
  .empty-props { padding: 12px; color: var(--muted); line-height: 1.6; }
  .empty-props ul { padding-left: 16px; margin: 6px 0; }

  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; grid-template-rows: 40vh 220px auto; }
    #outline { order: 2; border-right: 0; border-top: 1px solid var(--line); }
    #view { order: 1; }
    #props { order: 3; border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
    body { height: auto; }
  }
</style>
</head>
<body>
<header class="toolbar">
  <h1>Critica</h1>
  <nav class="menubar" aria-label="Main menu">
    <div class="menu">
      <button class="tb menu-button" id="file-menu-button" aria-haspopup="menu" aria-expanded="false" aria-controls="file-menu">File</button>
      <div class="menu-list" id="file-menu" role="menu" hidden>
        <button class="menu-item" role="menuitem" id="new" title="Start an empty scene">New</button>
        <button class="menu-item" role="menuitem" id="open" title="Open a scene (.json) or an OpenMC geometry.xml / model.xml — or drop a file anywhere">Open… <kbd>Ctrl+O</kbd></button>
        <button class="menu-item" role="menuitem" id="save" title="Download the scene as JSON">Save <kbd>Ctrl+S</kbd></button>
        <div class="menu-sep" role="separator"></div>
        <div class="submenu">
          <button class="menu-item" role="menuitem" aria-haspopup="menu" aria-expanded="false" id="export-menu-button">Export as <span class="chevron">▸</span></button>
          <div class="menu-list submenu-list" role="menu" id="export-menu" hidden>
            <button class="menu-item" role="menuitem" id="export-model" title="Materials, geometry and any settings/tallies from the opened file">OpenMC model.xml…</button>
            <button class="menu-item" role="menuitem" id="export-geometry" title="Just the geometry">OpenMC geometry.xml…</button>
            <button class="menu-item" role="menuitem" id="export-materials" title="Just the material library">OpenMC materials.xml…</button>
            <button class="menu-item" role="menuitem" id="export-settings" title="The settings with the external sources">OpenMC settings.xml…</button>
          </div>
        </div>
      </div>
    </div>
    <button class="tb" id="settings-open" title="Scene settings: world box, tessellation, up axis">Settings</button>
    <div class="menu">
      <button class="tb menu-button" id="help-menu-button" aria-haspopup="menu" aria-expanded="false" aria-controls="help-menu">Help</button>
      <div class="menu-list" id="help-menu" role="menu" hidden>
        <button class="menu-item" role="menuitem" id="tutorial-open">Tutorial…</button>
        <button class="menu-item" role="menuitem" id="shortcuts-open">Keyboard shortcuts… <kbd>?</kbd></button>
      </div>
    </div>
  </nav>
  <div class="tabs" role="tablist" aria-label="Workspace">
    <button class="tab on" role="tab" id="tab-geometry" aria-selected="true" aria-controls="ribbon-geometry">Geometry</button>
    <button class="tab" role="tab" id="tab-materials" aria-selected="false" aria-controls="ribbon-materials">Materials</button>
    <button class="tab" role="tab" id="tab-sources" aria-selected="false" aria-controls="ribbon-sources">Source</button>
  </div>
  <span class="spacer"></span>
  <button class="tb ribbon-toggle" id="ribbon-toggle" title="Collapse the ribbon" aria-expanded="true">▴</button>
  <input type="file" id="file" accept=".json,.xml,.dat,application/json,application/xml" hidden>
</header>
<div class="ribbon" id="ribbon">
  <div class="ribbon-panel" id="ribbon-geometry" role="tabpanel" aria-labelledby="tab-geometry">
    <div class="rgroup"><div class="rgroup-body big" id="surfaces" aria-label="Surfaces"></div><div class="rgroup-label">Surfaces</div></div>
    <div class="rgroup"><div class="rgroup-body big" id="primitives" aria-label="Shapes"></div><div class="rgroup-label">Shapes</div></div>
    <div class="rgroup">
      <div class="rgroup-body"><div class="rgroup-body big" id="operations" aria-label="Combine selection"></div><div class="rstack" id="operations-more"></div></div>
      <div class="rgroup-label">Combine</div>
    </div>
    <div class="rgroup">
      <div class="rgroup-body">
        <button class="tb big" id="cutaway-toggle" title="Cutaway: section plane, quarter or eighth cut (K)"></button>
        <div class="rstack">
          <button class="tb" id="color-material" title="Color by material, with a legend (M)">By material</button>
          <button class="tb" id="void" title="Show void cells (V)">Void</button>
          <button class="tb" id="world-box" title="Show the world box as a wireframe (W)">World box</button>
          <button class="tb" id="isolate" title="Show only the selected nodes (I)">Isolate</button>
          <button class="tb" id="xray" title="Show hidden selected nodes as an x-ray ghost (X)">X-ray</button>
          <button class="tb" id="grid-toggle" title="Show the grid plane (G)">Grid</button>
          <button class="tb" id="axes-toggle" title="Show the X, Y and Z axis lines (A)">Axes</button>
          <button class="tb" id="sources-toggle" title="Show the external sources (Source tab) in the viewport">Sources</button>
        </div>
        <button class="tb big" id="fit" title="Frame the visible geometry (F)"></button>
      </div>
      <div class="rgroup-label">View</div>
    </div>
    <div class="rgroup"><div class="rgroup-body big"><button class="tb" id="xml-preview-open" title="Show the OpenMC XML that File → Export as would write"></button></div><div class="rgroup-label">OpenMC</div></div>
  </div>
  <div class="ribbon-panel" id="ribbon-sources" role="tabpanel" aria-labelledby="tab-sources" hidden>
    <div class="rgroup"><div class="rgroup-body big" id="ribbon-src-add"></div><div class="rgroup-label">Add source</div></div>
    <div class="rgroup"><div class="rgroup-body big" id="ribbon-src-edit"></div><div class="rgroup-label">Source</div></div>
    <div class="rgroup"><div class="rgroup-body big" id="ribbon-src-openmc"></div><div class="rgroup-label">OpenMC</div></div>
  </div>
  <div class="ribbon-panel" id="ribbon-materials" role="tabpanel" aria-labelledby="tab-materials" hidden>
    <div class="rgroup"><div class="rgroup-body big" id="ribbon-mat-library"></div><div class="rgroup-label">Library</div></div>
    <div class="rgroup"><div class="rgroup-body big" id="ribbon-mat-edit"></div><div class="rgroup-label">Material</div></div>
  </div>
</div>
<dialog class="modal" id="tutorial" aria-labelledby="tutorial-title">
  <div class="dialog-head">
    <h2 id="tutorial-title">Tutorial</h2>
    <button class="tb dialog-close" title="Close (Esc)" aria-label="Close">✕</button>
  </div>
  <div class="dialog-body" id="tutorial-body"></div>
</dialog>
<dialog class="modal" id="shortcuts" aria-labelledby="shortcuts-title">
  <div class="dialog-head">
    <h2 id="shortcuts-title">Keyboard shortcuts</h2>
    <button class="tb dialog-close" title="Close (Esc)" aria-label="Close">✕</button>
  </div>
  <div class="dialog-body" id="shortcuts-body"></div>
</dialog>
<dialog class="modal" id="xml-preview" aria-labelledby="xml-preview-title">
  <div class="dialog-head">
    <h2 id="xml-preview-title">OpenMC XML preview</h2>
    <button class="tb dialog-close" title="Close (Esc)" aria-label="Close">✕</button>
  </div>
  <div class="dialog-body" id="xml-preview-body"></div>
</dialog>
<dialog class="modal" id="settings" aria-labelledby="settings-title">
  <div class="dialog-head">
    <h2 id="settings-title">Scene settings</h2>
    <button class="tb dialog-close" title="Close (Esc)" aria-label="Close">✕</button>
  </div>
  <div id="settings-body"></div>
</dialog>
<main id="ws-geometry" role="tabpanel" aria-labelledby="tab-geometry">
  <section class="panel" id="outline">
    <h2 id="tree-head">Scene tree <span class="panel-actions" id="tree-actions"></span></h2>
    <div id="tree" tabindex="0"></div>
  </section>
  <section id="view">
    <canvas id="canvas"></canvas>
    <div class="cutaway-panel" id="cutaway-panel" hidden></div>
    <div class="legend" id="legend" hidden></div>
    <div id="status"><span id="msg">loading…</span><span id="stats"></span></div>
  </section>
  <aside class="panel" id="props"></aside>
</main>
<main id="ws-sources" class="sources-main" role="tabpanel" aria-labelledby="tab-sources" hidden>
  <section class="panel" id="src-list-panel">
    <h2>Sources</h2>
    <div id="src-list"></div>
  </section>
  <div id="src-view-slot"></div>
  <aside class="panel" id="src-side">
    <div id="src-editor"></div>
    <div class="section" id="src-summary"></div>
  </aside>
</main>
<main id="ws-materials" class="materials-main" role="tabpanel" aria-labelledby="tab-materials" hidden>
  <section class="panel" id="mat-list-panel">
    <h2>Material library</h2>
    <div class="mat-search-row"><input type="text" id="mat-search" placeholder="Filter by id or name" spellcheck="false"></div>
    <div id="mat-list"></div>
  </section>
  <section class="panel" id="mat-editor"></section>
  <aside class="panel" id="mat-summary"></aside>
  <div class="mat-status" id="mat-status"></div>
</main>
<dialog class="modal" id="library-picker" aria-labelledby="library-title">
  <div class="dialog-head">
    <h2 id="library-title">Material library</h2>
    <button class="tb dialog-close" title="Close (Esc)" aria-label="Close">✕</button>
  </div>
  <div class="dialog-body">
    <p class="note" id="library-source"></p>
    <div class="library-search-row"><input type="text" id="library-search" placeholder="Search (e.g. water, steel, concrete)" spellcheck="false"><span class="muted" id="library-count"></span></div>
    <div id="library-list"></div>
  </div>
</dialog>
<script type="module" src="builder.js"></script>
</body>
</html>
