<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Geomium Playground</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;500;700&display=swap">
<style>
  :root {
    --font-ui: "Ubuntu", system-ui, -apple-system, sans-serif; --bg: #14161a; --panel: #1c1f25; --line: #2c313a; --text: #d8dce3; --muted: #8a919e; --accent: #6cb6ff; --err: #ff7b72; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 13px/1.4 var(--font-ui); }
  main { display: grid; grid-template-columns: minmax(320px, 38%) 1fr; height: 100%; }
  aside { display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--panel); min-height: 0; }
  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0 auto 0 0; font-weight: 500; }
  header h1 a { color: var(--accent); font-weight: 400; margin-left: 6px; font-size: 12px; }
  button, select { background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 5px 10px; font: inherit; cursor: pointer; }
  button.primary { background: var(--accent); color: #0b1220; border-color: var(--accent); font-weight: 500; }
  textarea { flex: 1; resize: none; border: 0; outline: 0; padding: 12px; background: transparent; color: var(--text); font: 13px/1.5 var(--font-ui); tab-size: 2; min-height: 0; }
  #status { padding: 8px 12px; border-top: 1px solid var(--line); color: var(--muted); font-family: var(--font-ui); white-space: pre-wrap; }
  #status.error { color: var(--err); }
  #view { position: relative; min-height: 0; }
  canvas { width: 100%; height: 100%; display: block; cursor: grab; }
  .hint { position: absolute; right: 12px; bottom: 10px; color: var(--muted); pointer-events: none; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; grid-template-rows: 50% 50%; } }
</style>
</head>
<body>
<main>
  <aside>
    <header>
      <h1>geomium <a href="index.html">builder</a></h1>
      <select id="examples"></select>
      <button id="stl">STL</button>
      <button id="run" class="primary" title="Ctrl+Enter">Run</button>
    </header>
    <textarea id="code" spellcheck="false"></textarea>
    <div id="status">loading…</div>
  </aside>
  <div id="view">
    <canvas id="canvas"></canvas>
    <div class="hint">drag to orbit · right-drag to pan · wheel to zoom</div>
  </div>
</main>
<script type="module">
import { init } from "../pkg/geomium.js";
import { createViewer } from "./viewer.js";

const EXAMPLES = {
  "Classic CSG": `// (cube ∩ sphere) − three cylinders
const body = geo.cube().tag(0).intersect(geo.sphere({ radius: 1.35 }).tag(1));
const rod = geo.cylinder({ radius: 0.6, start: [0, -2, 0], end: [0, 2, 0] }).tag(2);
return body.subtract(rod, rod.rotateX(90), rod.rotateZ(90));`,
  "Bolt": `const head = geo.cylinder({ start: [0, 0, 0], end: [0, 0.6, 0], radius: 1, slices: 6 }).tag(0);
const shaft = geo.cylinder({ start: [0, -3, 0], end: [0, 0, 0], radius: 0.5 }).tag(1);
const tip = geo.cone({ start: [0, -3, 0], end: [0, -3.4, 0], radius: 0.5 }).tag(1);
const thread = [];
for (let i = 0; i < 10; i++) {
  thread.push(geo.torus({ center: [0, -0.4 - i * 0.25, 0], major: 0.55, minor: 0.07, segments: 32, rings: 8 }));
}
return head.union(shaft, tip).subtract(thread.map(t => t.tag(2)));`,
  "Mug": `const outer = geo.cylinder({ start: [0, 0, 0], end: [0, 2, 0], radius: 1, slices: 64 });
const inner = geo.cylinder({ start: [0, 0.15, 0], end: [0, 2.1, 0], radius: 0.88, slices: 64 });
const handle = geo.torus({ major: 0.55, minor: 0.12, segments: 48, rings: 16 })
  .rotateX(90).translate(1, 1, 0)
  .subtract(geo.cylinder({ start: [0, -1, 0], end: [0, 3, 0], radius: 0.95 }));
return outer.subtract(inner).tag(0).union(handle.tag(1));`,
  "Swiss cheese": `let cheese = geo.cube({ size: [3, 1.6, 2] }).tag(0);
const holes = [];
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
for (let i = 0; i < 14; i++) {
  holes.push(geo.sphere({ center: [rnd() * 3 - 1.5, rnd() * 1.6 - 0.8, rnd() * 2 - 1], radius: 0.15 + rnd() * 0.3, slices: 20, stacks: 10 }).tag(1));
}
return cheese.subtract(holes);`,
};

const PALETTE = [[0.42, 0.71, 1.0], [1.0, 0.62, 0.35], [0.55, 0.85, 0.5], [0.85, 0.55, 0.9], [0.95, 0.85, 0.4]];

const $ = (id) => document.getElementById(id);
const code = $("code"), status = $("status"), select = $("examples");
for (const name of Object.keys(EXAMPLES)) select.add(new Option(name, name));
code.value = EXAMPLES[select.value];
select.onchange = () => { code.value = EXAMPLES[select.value]; run(); };

const geo = await init();
const viewer = createViewer($("canvas"));
let current = null;

function colorsFor(mesh) {
  const colors = new Float32Array(mesh.positions.length);
  mesh.tags.forEach((t, i) => colors.set(PALETTE[t % PALETTE.length], i * 3));
  return colors;
}

function run() {
  const t0 = performance.now();
  try {
    const result = new Function("geo", code.value)(geo);
    if (!result || typeof result.toMesh !== "function") throw new Error("script must return a Solid");
    const mesh = result.toMesh();
    const ms = performance.now() - t0;
    current?.dispose();
    current = result;
    viewer.setMesh(mesh, colorsFor(mesh));
    viewer.fit(result.bounds);
    status.className = "";
    status.textContent = `${result.triangleCount} triangles · volume ${result.volume.toFixed(4)} · ${ms.toFixed(1)} ms · ${geo.liveCount} live solids`;
  } catch (e) {
    status.className = "error";
    status.textContent = String(e.message ?? e);
  }
}

$("run").onclick = run;
code.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
  if (e.key === "Tab") { e.preventDefault(); code.setRangeText("  ", code.selectionStart, code.selectionEnd, "end"); }
});
$("stl").onclick = () => {
  if (!current) return;
  const url = URL.createObjectURL(new Blob([current.toSTL()], { type: "model/stl" }));
  Object.assign(document.createElement("a"), { href: url, download: "geomium.stl" }).click();
  URL.revokeObjectURL(url);
};

run();
</script>
</body>
</html>
