# nginx site for geomium (static files, no server-side code).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Relative redirects: correct behind port mapping and reverse proxies
    # (otherwise nginx would put its internal port 8080 in Location).
    absolute_redirect off;

    # The pages use relative paths (../pkg/…), so they live under /examples/.
    location = / {
        return 302 /examples/;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Ship a minimal surface: only the app's files are served.
    location ~ /\. {
        deny all;
    }

    # File names are not content-hashed, so let browsers revalidate (ETag)
    # instead of caching blindly: deploys take effect on the next load.
    location ~* \.(?:html|js|wasm|css)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # The data modules (nuclear data, PNNL library) and the wasm compress well.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/wasm image/svg+xml;

    # .wasm is served as application/wasm by nginx's default mime.types,
    # which browsers require for streaming compilation.

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
